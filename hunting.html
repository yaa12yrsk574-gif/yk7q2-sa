<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>狩り場</title>
<link rel="stylesheet" href="hunting/style.css"></head><body>
<canvas id="v"></canvas>
<div id="top"><button class="btn" id="mateBtn">相棒：なし</button><span id="bp" class="btn" style="pointer-events:none">設計図 0</span><span id="life" class="btn" style="pointer-events:none">HP 24/24</span><span id="enemySt" class="btn" style="pointer-events:none">野生トカゲ HP —</span></div>
<div id="pauseV" style="display:none;position:fixed;inset:0;z-index:55;background:rgba(43,42,39,.45);color:#fff;font:900 22px/1.5 sans-serif;align-items:center;justify-content:center;text-align:center">一時停止中<br><span style="font-size:14px;font-weight:700">クリックで再開</span></div>
<button class="btn big" id="campBtn" style="display:none;position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:9;background:#d9572b;color:#fff">⛺ 工房をひらく<span class="kb">E</span></button>
<div id="act"><button class="btn big" id="mateAtk" disabled>重い技<span class="kb">K</span></button><button class="btn big" id="hit">叩く<span class="kb">J</span></button></div>
<div id="stat">WASD／矢印で歩く。初回は<b>Jで叩いて設計図を拾う</b>→工房→相棒に選ぶ。<br>騎乗中：<b>WASDで移動・Shiftで歩く</b>、J＝速い技、K＝重い技。敵の赤い予兆を見てかわそう！</div>
<div id="dbg" style="display:none;position:fixed;left:8px;top:56px;z-index:60;background:#c0392b;color:#fff;font:700 12px/1.4 sans-serif;padding:6px 10px;border-radius:8px;max-width:70vw"></div><div id="msg"></div><div id="pad"><i></i></div>
<div id="pickDlg"><div class="card"><div style="display:flex;align-items:center;gap:8px"><b style="flex:1">相棒をえらぶ（工房の作品）</b><button class="btn" id="pickClose">閉じる</button></div><div id="pickList"></div></div></div>

<script src="vendor/three.min.js"></script>
<script src="shared/project-data.js"></script>
<script src="shared/storage.js"></script>
<script src="shared/templates.js"></script>
<script src="shared/bones.js"></script>
<script src="hunting/app.js"></script>
</body></html>
