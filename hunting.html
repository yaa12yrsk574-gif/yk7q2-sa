<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>狩り場</title>
<link rel="stylesheet" href="hunting/style.css?v=f83d871dd96e"></head><body>
<canvas id="v"></canvas>
<div id="top"><button class="btn" id="mateBtn">相棒：なし</button><span id="bp" class="btn" style="pointer-events:none">設計図 0</span><button class="btn" id="timeBtn" title="時間帯を進める（T）">☀ 昼</button><button class="btn" id="tuneBtn" title="移動と大きさの数値を調整">⚙</button></div>
<div id="tune"><div class="hd"><b>⚙ 大きさと動き</b><span style="flex:1"></span><button class="btn" id="tuneCopy">数値をコピー</button><button class="btn" id="tuneReset">初期値</button><button class="btn" id="tuneClose">閉じる</button></div><div id="tuneRows"></div></div>
<div id="pauseV" style="display:none;position:fixed;inset:0;z-index:55;background:rgba(43,42,39,.45);color:#fff;font:900 22px/1.5 sans-serif;align-items:center;justify-content:center;text-align:center">一時停止中<br><span style="font-size:14px;font-weight:700">クリックで再開</span></div>
<button class="btn big" id="campBtn" style="display:none;position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:9;background:#d9572b;color:#fff">⛺ 工房をひらく<span class="kb">E</span></button>
<div id="act"><button class="btn big" id="jumpBtn">ジャンプ／羽ばたき<span class="kb">Space</span></button></div>
<button class="btn big" id="birdBtn" style="display:none;position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:9;background:#2b8bb8;color:#fff">🪽 鳥人間にでる<span class="kb">E</span></button>
<div id="bird"><div class="d"><b id="bD">0.0</b><small>m</small></div><div class="bb" id="bB">ベスト まだなし</div><div class="sb"><i id="bS"></i></div><div class="sl">スタミナ</div></div>
<div id="birdRes"><div class="t" id="rT">ドボン！</div><div class="r" id="rR"></div><div class="row"><button class="btn big" id="rAgain">もう一回<span class="kb">R</span></button><button class="btn" id="rSwim">このまま泳ぐ</button></div></div>
<button class="btn big" id="lookBtn" style="display:none;position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:9;background:#2f6fd0;color:#fff"><span>🔍 調べる</span><span class="kb">E</span></button>
<div id="stat"></div>
<div id="dbg" style="display:none;position:fixed;left:8px;top:56px;z-index:60;background:#c0392b;color:#fff;font:700 12px/1.4 sans-serif;padding:6px 10px;border-radius:8px;max-width:70vw"></div><div id="msg"></div><div id="pad"><i></i></div><div id="wpad"><b></b></div>
<div id="pickDlg"><div class="card"><div style="display:flex;align-items:center;gap:8px"><b style="flex:1">相棒をえらぶ（工房の作品）</b><button class="btn" id="pickClose">閉じる</button></div><div id="pickList"></div></div></div>

<script src="shared/templates.js?v=3a1da99f5b91"></script>
<script src="shared/paint-cut.js?v=5966d010acb5"></script>
<script src="shared/bones.js?v=a13370f37c9a"></script>
<script src="shared/movement.js?v=35764e28e9ab"></script>
<script src="hunting/app.js?v=9282608221bd"></script>
</body></html>
